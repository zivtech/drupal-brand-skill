# Text capacity limits per layout
# Values: [title_max_chars, body_max_chars, title_font_size, body_font_size]
# Font sizes are in hundredths of a point (2400 = 24pt)
text_capacity:
  # Opening slides - large titles, minimal body
  title_opening: [200, 150, 3600, 1800]
  hero_photo: [150, 300, 3600, 1400]
  statement_center: [200, 300, 3200, 1600]

  # Section dividers - allow longer titles
  section_divider: [150, 300, 4000, 1800]

  # Content with image (half slide for text)
  content_image_left: [150, 500, 2400, 1400]
  content_image_right: [150, 500, 2400, 1400]

  # Feature slides - medium text areas
  feature_blue_bg: [150, 500, 2400, 1400]
  feature_yellow_bg: [150, 500, 2400, 1400]
  feature_white_bg: [150, 500, 2400, 1400]
  feature_coral_gui: [150, 500, 2400, 1400]
  feature_yellow_gui: [150, 500, 2400, 1400]

  # Statistics - large number, supporting text
  stat_outline_gui: [50, 500, 7200, 1400]
  stat_coral_filled: [50, 500, 7200, 1400]
  stat_photo_left: [50, 500, 7200, 1400]
  stat_navy_filled: [50, 500, 7200, 1400]
  stat_photo_bg: [50, 400, 7200, 1400]

  # Quotes - medium quote, short attribution
  quote_navy_bg: [300, 200, 2400, 1600]
  quote_centered: [300, 200, 2800, 1400]

  # Two-column - split content
  two_column: [100, 600, 2400, 1200]

  # Photo features
  photo_text_left: [150, 300, 2800, 1400]
  photo_text_right: [150, 400, 2400, 1400]

  # Speaker bio
  speaker_bio: [100, 500, 3200, 1400]

  # Numbered content
  numbered_02: [50, 500, 7200, 1400]
  numbered_03: [50, 500, 7200, 1400]
  numbered_04: [50, 500, 7200, 1400]
  numbered_05: [50, 500, 7200, 1400]

  # Closing
  closing_cta: [200, 200, 3200, 1800]
  closing_statement: [300, 200, 2000, 1400]

  # Blank/flexible
  blank_title_image: [200, 300, 2800, 1400]
  blank_full_image: [200, 300, 2800, 1400]

  # Extended template slides
  stats_dashboard: [50, 300, 7200, 1800]
  case_study_full: [100, 600, 2400, 1400]

  # Default fallback
  default: [150, 500, 2400, 1400]

# Content type detection patterns (Drupal-specific keywords added)
content_patterns:
  statistic:
    title_patterns:
      - '^\d+%'
      - '^\$[\d,]+'
      - '^[\d,]+\+?\s*(million|billion|users|websites|developers|organizations)'
      - '^\d+x'
      - '^\d+/\d+'
      - '^#\d+'
    anywhere_patterns:
      - '\b\d{2,}%\b'
      - '\b\d+\s*(million|billion)\b'
      - '\bover\s+\d+'
      - '\bmore than\s+\d+'

  quote:
    title_patterns:
      - '^["""]'
    body_patterns:
      - '^\s*—'
      - 'said\s+\w+'

  numbered_step:
    title_patterns:
      - '^(step\s*)?\d+[.:\)]'
      - '^(first|second|third|fourth|fifth)'
      - '\bphase\s*\d+'
      - '\bpart\s*\d+'

  bullet_list:
    body_patterns:
      - '^\s*[-•▪]\s+'
      - '\n\s*[-•▪]\s+'

  comparison:
    anywhere_patterns:
      - '\bvs\.?\b'
      - '\bbefore\b.*\bafter\b'
      - '\bpros?\b.*\bcons?\b'

  section_header:
    keywords:
      - 'overview'
      - 'introduction'
      - 'summary'
      - 'agenda'
      - 'contents'
      - 'why'
      - 'what is'
      - 'features'
      - 'benefits'
      - 'resources'

  case_study:
    keywords:
      - 'customer'
      - 'client'
      - 'case study'
      - 'success story'
      - 'testimonial'
      - 'partner'
      - 'rebuilt'
      - 'transformed'
      - 'organization'
      - 'implemented'
      - 'content hub'
      - 'replatform'
      - 'arsenal'
      - 'premier league'
      - 'health portal'
    title_patterns:
      - '\bhow\s+\w+\s+(rebuilt|transformed|migrated|updated|launched)'

  feature:
    keywords:
      - 'feature'
      - 'capability'
      - 'integration'
      - 'benefit'
      - 'advantage'
      - 'solution'
      - 'powerful'
      - 'flexible'
      - 'drupal'
      - 'cms'
      - 'content management'

# Orientation configuration for layout variety
orientations:
  left:
    - 'content_image_left'
    - 'photo_text_left'
    - 'stat_photo_left'
  right:
    - 'content_image_right'
    - 'photo_text_right'
    - 'feature_white_bg'
  center:
    - 'statement_center'
    - 'quote_centered'
    - 'section_divider'
    - 'closing_cta'
    - 'stats_dashboard'
    - 'case_study_full'

# GUI block color rotation order (Drupal brand)
gui_colors:
  - 'blue'
  - 'coral'
  - 'yellow'
  - 'navy'
