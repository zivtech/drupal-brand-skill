# Drupal Brand Configuration for Presentation Toolkit
# All brand-specific values extracted from the original migrate.py

version: "1.0"
brand_name: "Drupal"

# Template files (relative to drupal-brand-skill root)
template:
  default: "templates/presentations/drupal-brand-template.pptx"
  extended: "templates/presentations/drupal-brand-template-extended.pptx"

# Drupal brand colors
colors:
  primary:
    drupal_blue: "009CDE"
    dark_blue: "006AA9"
    navy: "12285F"
  secondary:
    light_blue: "CCEDF9"
    white: "FFFFFF"
    black: "000000"
  tertiary:
    purple: "CCBAF4"
    yellow: "FFC423"
    red: "F46351"
    green: "397618"

# Font configuration
fonts:
  brand:
    - "ZT Gatha"
    - "Noto Sans"
    - "Noto"
  replace:
    - "Ubuntu"
    - "Arial"
    - "Calibri"
    - "Helvetica"
    - "Verdana"
    - "Tahoma"
    - "Times"
    - "Georgia"
  mapping:
    headlines: "ZT Gatha Bold"
    subheads: "ZT Gatha SemiBold"
    body: "Noto Sans Regular"
    emphasis: "Noto Sans Bold"
    medium: "Noto Sans Medium"
    captions: "Noto Sans Italic"

